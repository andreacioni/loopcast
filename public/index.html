<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LoopCast</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>LoopCast</h1>
    <button id="discoverBtn">Rescan network</button>
  </header>

  <main>
    <section id="deviceBar">
      <label>
        Library
        <select id="serverSelect"></select>
      </label>
      <label>
        Play on
        <select id="rendererSelect"></select>
      </label>
    </section>

    <section id="continueWatching" class="hidden">
      <h2>Continue watching</h2>
      <div id="continueWatchingTrack"></div>
    </section>

    <section id="nowPlaying" class="hidden">
      <h2 id="npTitle"></h2>
      <div id="npControls">
        <button id="pauseBtn">Pause / Play</button>
        <button id="stopBtn">Stop</button>
        <span id="npPosition"></span>
      </div>
      <p id="npResumeNote"></p>
    </section>

    <nav id="breadcrumbs"></nav>

    <section id="browser">
      <ul id="itemList"></ul>
    </section>
  </main>

  <!-- Custom confirm dialog, replaces window.confirm -->
  <div id="modalOverlay" class="hidden">
    <div id="modalBox" role="dialog" aria-modal="true">
      <h3 id="modalTitle"></h3>
      <p id="modalMessage"></p>
      <div id="modalActions"></div>
    </div>
  </div>

  <!-- Lightweight toast, replaces window.alert -->
  <div id="toast" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
